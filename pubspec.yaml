name: booklet
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.3.3
  flutter_localizations:
    sdk: flutter
  flutter_quill: ^11.5.1
  file_selector: ^1.0.3
  desktop_drop: ^0.8.4
  shared_preferences: ^2.5.3
  html: ^0.15.7
  uuid: ^4.5.1
  video_player: ^2.14.0
  video_thumbnail: ^0.5.6
  just_audio: ^0.10.6
  flutter_code_editor: ^0.3.5
  highlight: ^0.7.0
  flutter_math_fork: ^0.7.4
  webview_all: ^1.4.2
  url_launcher: ^6.3.2
  flutter_colorpicker: ^1.1.0
  desktop_multi_window: ^0.3.1
  pdfrx: ^2.10.1
  ffi: ^2.2.0
  image: ^4.12.0
  pdfium_dart: ^0.4.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Bangers-OFL.txt
    - assets/fonts/Pacifico-OFL.txt
    - assets/fonts/CourierPrime-OFL.txt
    - assets/fonts/ComicNeue-OFL.txt
  fonts:
    - family: Bangers
      fonts:
        - asset: assets/fonts/Bangers.ttf
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico.ttf
    - family: CourierPrime
      fonts:
        - asset: assets/fonts/CourierPrime.ttf
    - family: ComicNeue
      fonts:
        - asset: assets/fonts/ComicNeue.ttf
